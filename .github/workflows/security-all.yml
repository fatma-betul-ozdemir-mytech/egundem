name: Security All Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ---------------- SEMGREP ----------------
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"
          output: semgrep-report.json
        continue-on-error: true

      # ---------------- TRIVY ----------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
        continue-on-error: true

      # ---------------- NIKTO ----------------
      - name: Install Nikto
        run: sudo apt-get update && sudo apt-get install -y nikto
      - name: Run Nikto
        run: nikto -h https://egundem.com -output nikto-report.txt || true

      # ---------------- NUCLEI ----------------
      - name: Install Nuclei
        run: |
          curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest \
          | grep "browser_download_url.*linux_amd64.zip" \
          | cut -d '"' -f 4 \
          | wget -qi -
          unzip nuclei-*-linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          nuclei -version
      - name: Run Nuclei Scan
        run: nuclei -u https://egundem.com -json -o nuclei-report.json || true

      # ---------------- BANDIT ----------------
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r . -f json -o bandit-report.json || true

      # ---------------- FOSSA ----------------
      - name: Run FOSSA scan
        run: |
          curl -H "Cache-Control: no-cache" https://raw.githubusercontent.com/fossas/fossa-cli/master/install.sh | bash
          fossa analyze
          fossa test || true
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

      # ---------------- RAPORLAMA (Issues oluşturma) ----------------
      - name: Create Semgrep Issues
        if: always()
        run: node .github/scripts/create-semgrep-issues.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create Trivy Issues
        if: always()
        run: node .github/scripts/create-trivy-issues.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create Nikto Issues
        if: always()
        run: node .github/scripts/create-nikto-issues.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create Nuclei Issues
        if: always()
        run: node .github/scripts/create-nuclei-issues.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create Bandit Issues
        if: always()
        run: node .github/scripts/create-bandit-issues.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create FOSSA Issues
        if: always()
        run: node .github/scripts/create-fossa-issues.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
